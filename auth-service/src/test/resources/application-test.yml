spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:auth;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password: ''
    driver-class-name: org.h2.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  cloud:
    discovery:
      enabled: false
  rabbitmq:
    listener:
      simple:
        auto-startup: false

auth:
  jwt:
    generate-ephemeral-key: true

eureka:
  client:
    enabled: false
