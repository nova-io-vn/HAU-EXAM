server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: auth-service
  rabbitmq:
    listener:
      simple:
        acknowledge-mode: manual
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

auth:
  bootstrap:
    enabled: ${BOOTSTRAP_ADMIN_ENABLED:false}
    lecturer-code: ${BOOTSTRAP_ADMIN_LECTURER_CODE:}
    email: ${BOOTSTRAP_ADMIN_EMAIL:}
    full-name: ${BOOTSTRAP_ADMIN_FULL_NAME:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
    faculty-id: ${BOOTSTRAP_ADMIN_FACULTY_ID:}
  jwt:
    issuer: ${JWT_ISSUER:hau-exam-auth}
    key-id: ${JWT_KEY_ID:hau-exam-auth-key}
    access-token-ttl: ${JWT_ACCESS_TTL:PT15M}
    refresh-token-ttl: ${JWT_REFRESH_TTL:P30D}
  messaging:
    retry-delay-ms: ${AUTH_EVENT_RETRY_DELAY_MS:5000}
    max-retries: ${AUTH_EVENT_MAX_RETRIES:3}
  security:
    password:
      bcrypt-strength: ${BCRYPT_STRENGTH:12}

management:
  endpoints:
    web:
      exposure:
        include: health,info
