spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:notification;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password: ''
    driver-class-name: org.h2.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  rabbitmq:
    listener:
      simple:
        auto-startup: false
  mail:
    host: localhost
    port: 1025
    username: ''
    password: ''
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
            required: false
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:9999/jwks
  cloud:
    discovery:
      enabled: false

notification:
  mail-from: no-reply@hau.edu.vn
  retry-delay-ms: 100
  scheduler-delay-ms: 600000
  websocket:
    allowed-origins: http://localhost:5173

user:
  service:
    url: http://localhost:8082
  internal:
    service-token: test-internal-token

push:
  expo:
    enabled: false

eureka:
  client:
    enabled: false
