spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: ${NOTIFICATION_DB_URL:jdbc:postgresql://localhost:5432/notification_db}
    username: ${NOTIFICATION_DB_USERNAME:postgres}
    password: ${NOTIFICATION_DB_PASSWORD:postgres}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:false}
          starttls:
            enable: ${SMTP_STARTTLS_ENABLED:false}
            required: ${SMTP_STARTTLS_REQUIRED:false}
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${JWT_JWK_SET_URI}

notification:
  mail-from: ${SMTP_FROM:no-reply@hau.edu.vn}
  websocket:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

user:
  service:
    url: ${USER_SERVICE_URL:http://localhost:8082}
  internal:
    service-token: ${INTERNAL_SERVICE_TOKEN:dev-internal-token}

push:
  expo:
    enabled: ${EXPO_PUSH_ENABLED:false}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
