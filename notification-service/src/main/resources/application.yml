server:
  port: ${SERVER_PORT:8086}

spring:
  application:
    name: notification-service
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  rabbitmq:
    listener:
      simple:
        acknowledge-mode: manual
        default-requeue-rejected: false

notification:
  retry-delay-ms: ${NOTIFICATION_RETRY_DELAY_MS:5000}
  scheduler-delay-ms: ${NOTIFICATION_SCHEDULER_DELAY_MS:5000}

push:
  expo:
    url: ${EXPO_PUSH_URL:https://exp.host/--/api/v2/push/send}

management:
  endpoints:
    web:
      exposure:
        include: health,info
