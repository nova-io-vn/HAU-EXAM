server:
  port: ${SERVER_PORT:8086}

spring:
  application:
    name: notification-service
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  rabbitmq:
    listener:
      simple:
        acknowledge-mode: manual
        default-requeue-rejected: false

notification:
  retry-delay-ms: ${NOTIFICATION_RETRY_DELAY_MS:5000}
  scheduler-delay-ms: ${NOTIFICATION_SCHEDULER_DELAY_MS:5000}
  mail-enabled: ${SMTP_ENABLED:true}
  mail-from-name: ${SMTP_FROM_NAME:HAU QM}

push:
  expo:
    url: ${EXPO_PUSH_URL:https://exp.host/--/api/v2/push/send}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    root: INFO
    com.notificationservice: ${NOTIFICATION_LOG_LEVEL:INFO}
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} level=%-5level service=${spring.application.name} thread=%thread correlationId=%X{correlationId:-} logger=%logger{36} message=%msg%n"
