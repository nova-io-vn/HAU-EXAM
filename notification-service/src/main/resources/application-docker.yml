spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: ${NOTIFICATION_DB_URL:jdbc:postgresql://postgres:5432/notification_db}
    username: ${NOTIFICATION_DB_USERNAME}
    password: ${NOTIFICATION_DB_PASSWORD}
  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
  mail:
    host: ${SMTP_HOST}
    port: ${SMTP_PORT}
    username: ${SMTP_USERNAME}
    password: ${SMTP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:true}
          starttls:
            enable: ${SMTP_STARTTLS_ENABLED:true}
            required: ${SMTP_STARTTLS_REQUIRED:true}
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${JWT_JWK_SET_URI}

notification:
  mail-from: ${SMTP_FROM}
  websocket:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

user:
  service:
    url: ${USER_SERVICE_URL:http://user-service:8082}
  internal:
    service-token: ${INTERNAL_SERVICE_TOKEN}

push:
  expo:
    enabled: ${EXPO_PUSH_ENABLED:false}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://eureka:8761/eureka/}
