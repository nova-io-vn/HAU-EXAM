server:
  port: ${SERVER_PORT:8084}

spring:
  application:
    name: exam-service
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    root: INFO
    com.examservice: ${EXAM_LOG_LEVEL:INFO}
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} level=%-5level service=${spring.application.name} thread=%thread correlationId=%X{correlationId:-} logger=%logger{36} message=%msg%n"
