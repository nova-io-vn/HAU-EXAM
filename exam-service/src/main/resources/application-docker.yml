spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: ${EXAM_DB_URL:jdbc:postgresql://postgres:5432/exam_db}
    username: ${EXAM_DB_USERNAME}
    password: ${EXAM_DB_PASSWORD}
  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${JWT_JWK_SET_URI}

exam:
  question-service-url: ${QUESTION_SERVICE_URL:http://question-service:8083}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://eureka:8761/eureka/}
