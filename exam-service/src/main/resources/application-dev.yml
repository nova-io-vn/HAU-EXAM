spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: ${EXAM_DB_URL:jdbc:postgresql://localhost:5432/exam_db}
    username: ${EXAM_DB_USERNAME:postgres}
    password: ${EXAM_DB_PASSWORD:postgres}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${JWT_JWK_SET_URI}

exam:
  question-service-url: ${QUESTION_SERVICE_URL:http://localhost:8083}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
