spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:foundation;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password: ''
    driver-class-name: org.h2.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:9999/jwks
  cloud:
    discovery:
      enabled: false

exam:
  question-service-url: http://localhost:9998

eureka:
  client:
    enabled: false
