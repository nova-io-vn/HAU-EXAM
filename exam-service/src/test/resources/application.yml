spring:
  datasource:

    url: jdbc:h2:mem:exam;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password: ''

    url: jdbc:h2:mem:foundation;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:9999/jwks
exam:
  question-service-url: http://localhost:9998

  flyway:
    enabled: true
  cloud:
    discovery:
      enabled: false

eureka:
  client:
    enabled: false
