name: Eureka CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "eureka/**"
      - "pom.xml"
      - ".github/workflows/eureka-ci.yml"

  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: nova-io-vn/hau-exam-eureka

jobs:
  build:
    name: Build Eureka
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Eureka image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./eureka/Dockerfile
          push: true
          tags: |
            ghcr.io/nova-io-vn/hau-exam-eureka:${{ github.sha }}
            ghcr.io/nova-io-vn/hau-exam-eureka:latest

  deploy-k3s:
    name: Deploy Eureka to K3s
    needs: build
    runs-on: self-hosted

    steps:
      - name: Show deployment version
        run: |
          echo "Commit: ${{ github.sha }}"
          echo "Runner: ${{ runner.name }}"

      - name: Deploy Eureka
        run: |
          set -e

          kubectl set image \
            deployment/eureka \
            eureka=ghcr.io/nova-io-vn/hau-exam-eureka:${{ github.sha }} \
            -n hau-exam

      - name: Wait for Eureka rollout
        run: |
          kubectl rollout status \
            deployment/eureka \
            -n hau-exam \
            --timeout=600s

      - name: Verify Eureka
        run: |
          set -e

          echo "===== DEPLOYMENT ====="
          kubectl get deployment eureka -n hau-exam

          echo
          echo "===== IMAGE ====="
          kubectl get deployment eureka \
            -n hau-exam \
            -o jsonpath='{.spec.template.spec.containers[0].image}'

          echo