name: Backend Services CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "gateway/**"
      - "auth-service/**"
      - "user-service/**"
      - "question-service/**"
      - "exam-service/**"
      - "ai-service/**"
      - "notification-service/**"
      - "pom.xml"
      - ".github/workflows/backend-services-ci.yml"

  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  detect-changes:
    name: Detect changed services
    runs-on: ubuntu-latest

    outputs:
      services: ${{ steps.changes.outputs.services }}
      has_changes: ${{ steps.changes.outputs.has_changes }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changed services
        id: changes
        shell: bash
        run: |
          set -euo pipefail

          ALL_SERVICES=(
            gateway
            auth-service
            user-service
            question-service
            exam-service
            ai-service
            notification-service
          )

          # Manual run: deploy all services.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SERVICES_JSON=$(printf '%s\n' "${ALL_SERVICES[@]}" | jq -R . | jq -sc .)

            echo "services=$SERVICES_JSON" >> "$GITHUB_OUTPUT"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"

            echo "Manual run - all services selected:"
            printf '%s\n' "${ALL_SERVICES[@]}"
            exit 0
          fi

          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"

          # New branch / unavailable previous SHA fallback.
          if [ -z "$BEFORE" ] || \
             [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            BEFORE="${AFTER}^"
          fi

          git diff --name-only "$BEFORE" "$AFTER" > /tmp/changed-files.txt

          echo "Changed files:"
          cat /tmp/changed-files.txt

          # Root pom.xml can affect every Maven service.
          if grep -qx "pom.xml" /tmp/changed-files.txt; then
            SERVICES_JSON=$(printf '%s\n' "${ALL_SERVICES[@]}" | jq -R . | jq -sc .)

            echo "services=$SERVICES_JSON" >> "$GITHUB_OUTPUT"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"

            echo "Root pom.xml changed - all services selected."
            exit 0
          fi

          CHANGED_SERVICES=()

          for SERVICE in "${ALL_SERVICES[@]}"; do
            if grep -q "^${SERVICE}/" /tmp/changed-files.txt; then
              CHANGED_SERVICES+=("$SERVICE")
            fi
          done

          if [ "${#CHANGED_SERVICES[@]}" -eq 0 ]; then
            echo 'services=[]' >> "$GITHUB_OUTPUT"
            echo 'has_changes=false' >> "$GITHUB_OUTPUT"
            echo "No backend service changes detected."
            exit 0
          fi

          SERVICES_JSON=$(printf '%s\n' "${CHANGED_SERVICES[@]}" | jq -R . | jq -sc .)

          echo "services=$SERVICES_JSON" >> "$GITHUB_OUTPUT"
          echo "has_changes=true" >> "$GITHUB_OUTPUT"

          echo "Selected services:"
          printf '%s\n' "${CHANGED_SERVICES[@]}"

  build-images:
    name: Build ${{ matrix.service }}
    needs: detect-changes

    if: needs.detect-changes.outputs.has_changes == 'true'

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.detect-changes.outputs.services) }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ghcr.io/nova-io-vn/hau-exam-${{ matrix.service }}:${{ github.sha }}
            ghcr.io/nova-io-vn/hau-exam-${{ matrix.service }}:latest

  deploy-k3s:
    name: Deploy to K3s
    needs:
      - detect-changes
      - build-images

    if: |
      always() &&
      needs.detect-changes.outputs.has_changes == 'true' &&
      needs.build-images.result == 'success'

    runs-on: self-hosted

    steps:
      - name: Show deployment information
        run: |
          echo "Commit: ${{ github.sha }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Runner: ${{ runner.name }}"
          echo 'Services: ${{ needs.detect-changes.outputs.services }}'

      - name: Deploy changed services
        shell: bash
        run: |
          set -euo pipefail

          SHA="${{ github.sha }}"

          echo '${{ needs.detect-changes.outputs.services }}' |
          jq -r '.[]' |
          while read -r SERVICE
          do
            echo "=========================================="
            echo "Deploying $SERVICE"
            echo "=========================================="

            kubectl set image \
              deployment/$SERVICE \
              $SERVICE=ghcr.io/nova-io-vn/hau-exam-$SERVICE:$SHA \
              -n hau-exam
          done

      - name: Configure startup probes
        shell: bash
        run: |
          set -euo pipefail

          declare -A PORTS=(
            [gateway]=8080
            [auth-service]=8081
            [user-service]=8082
            [question-service]=8083
            [exam-service]=8084
            [ai-service]=8085
            [notification-service]=8086
          )

          echo '${{ needs.detect-changes.outputs.services }}' |
          jq -r '.[]' |
          while read -r SERVICE
          do
            PORT="${PORTS[$SERVICE]}"
            kubectl patch deployment "$SERVICE" \
              -n hau-exam \
              --type=strategic \
              --patch "{\"spec\":{\"template\":{\"spec\":{\"containers\":[{\"name\":\"$SERVICE\",\"startupProbe\":{\"tcpSocket\":{\"port\":$PORT},\"periodSeconds\":10,\"timeoutSeconds\":5,\"failureThreshold\":30}}]}}}}"
          done

      - name: Wait for changed service rollouts
        shell: bash
        run: |
          set -euo pipefail

          echo '${{ needs.detect-changes.outputs.services }}' |
          jq -r '.[]' |
          while read -r SERVICE
          do
            echo "=========================================="
            echo "Waiting for $SERVICE"
            echo "=========================================="

            kubectl rollout status \
              deployment/$SERVICE \
              -n hau-exam \
              --timeout=900s
          done

      - name: Show failed rollout diagnostics
        if: failure()
        shell: bash
        run: |
          set +e

          echo '${{ needs.detect-changes.outputs.services }}' |
          jq -r '.[]' |
          while read -r SERVICE
          do
            echo "===== DEPLOYMENT: $SERVICE ====="
            kubectl get deployment "$SERVICE" -n hau-exam -o wide
            kubectl describe deployment "$SERVICE" -n hau-exam

            echo "===== REPLICA SETS: $SERVICE ====="
            kubectl get rs -n hau-exam -o wide

            echo "===== PODS: $SERVICE ====="
            PODS=$(kubectl get pods -n hau-exam -o name | grep "$SERVICE")
            for POD in $PODS
            do
              kubectl get "$POD" -n hau-exam -o wide
              kubectl describe "$POD" -n hau-exam
              kubectl logs "$POD" -n hau-exam --tail=300
              kubectl logs "$POD" -n hau-exam --previous --tail=300
            done
          done

          echo "===== RECENT EVENTS ====="
          kubectl get events -n hau-exam --sort-by=.metadata.creationTimestamp

      - name: Show production workloads
        if: always()
        run: |
          echo "===== DEPLOYMENTS ====="
          kubectl get deployments -n hau-exam

          echo
          echo "===== PODS ====="
          kubectl get pods -n hau-exam -o wide

      - name: Verify deployed images
        shell: bash
        run: |
          set -euo pipefail

          EXPECTED_SHA="${{ github.sha }}"

          echo '${{ needs.detect-changes.outputs.services }}' |
          jq -r '.[]' |
          while read -r SERVICE
          do
            IMAGE=$(kubectl get deployment "$SERVICE" \
              -n hau-exam \
              -o jsonpath='{.spec.template.spec.containers[0].image}')

            echo "$SERVICE -> $IMAGE"

            case "$IMAGE" in
              *":$EXPECTED_SHA")
                ;;
              *)
                echo "ERROR: $SERVICE is not running expected SHA."
                exit 1
                ;;
            esac
          done

      - name: Internal gateway health check
        run: |
          set -e

          for i in 1 2 3 4 5
          do
            if curl \
              --fail \
              --silent \
              --show-error \
              --connect-timeout 5 \
              --max-time 15 \
              -H "Host: api.nova.io.vn" \
              http://127.0.0.1/actuator/health
            then
              echo
              echo "Production gateway is healthy."
              exit 0
            fi

            echo "Health check attempt $i failed. Retrying..."
            sleep 10
          done

          echo "Gateway health check failed."
          exit 1
