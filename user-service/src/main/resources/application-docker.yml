spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: ${USER_DB_URL:jdbc:postgresql://postgres:5432/user_db}
    username: ${USER_DB_USERNAME}
    password: ${USER_DB_PASSWORD}
  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${JWT_JWK_SET_URI}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://eureka:8761/eureka/}

user:
  internal:
    service-token: ${INTERNAL_SERVICE_TOKEN}
