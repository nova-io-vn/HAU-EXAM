server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: user-service
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  rabbitmq:
    listener:
      simple:
        acknowledge-mode: manual
        default-requeue-rejected: false

user:
  messaging:
    retry-delay-ms: ${USER_REGISTRATION_RETRY_DELAY_MS:5000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
