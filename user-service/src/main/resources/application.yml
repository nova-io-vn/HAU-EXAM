server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: user-service
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  rabbitmq:
    listener:
      simple:
        acknowledge-mode: manual
        default-requeue-rejected: false

user:
  messaging:
    retry-delay-ms: ${USER_REGISTRATION_RETRY_DELAY_MS:5000}

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}
  image-max-size-bytes: ${CLOUDINARY_IMAGE_MAX_SIZE_BYTES:5242880}

management:
  endpoints:
    web:
      exposure:
        include: health,info
