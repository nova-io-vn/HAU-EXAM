spring:
  config:
    activate:
      on-profile: test
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:9999/jwks
  data:
    redis:
      host: localhost
      port: 6379
  cloud:
    discovery:
      enabled: false
    gateway:
      server:
        webflux:
          default-filters: []
          globalcors:
            cors-configurations:
              '[/**]':
                allowed-origins: [http://localhost:5173]
                allowed-methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
                allowed-headers: [Authorization, Content-Type, X-Correlation-Id, Accept]
                exposed-headers: [X-Correlation-Id]
                allow-credentials: true

eureka:
  client:
    enabled: false
