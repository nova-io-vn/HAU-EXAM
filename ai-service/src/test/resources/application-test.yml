spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:ai;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password: ''
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  rabbitmq:
    listener:
      simple:
        auto-startup: false
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:9999/jwks
  cloud:
    discovery:
      enabled: false

ai:
  internal:
    result-token: test-internal-token
  document:
    max-size-bytes: 1024
  storage:
    root: ./target/test-storage
  provider:
    api-key: ''
    url: http://localhost/unused?key=
  rabbitmq:
    retry-delay-ms: 10
    max-retries: 3
    concurrency: 1

eureka:
  client:
    enabled: false
