spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: ${AI_DB_URL:jdbc:postgresql://postgres:5432/ai_db}
    username: ${AI_DB_USERNAME}
    password: ${AI_DB_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${JWT_JWK_SET_URI}

ai:
  internal:
    result-token: ${INTERNAL_SERVICE_TOKEN}
  storage:
    root: ${AI_STORAGE_ROOT:/data/ai-documents}
  provider:
    api-key: ${AI_API_KEY}
    url: ${AI_API_URL:https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://eureka:8761/eureka/}
