server:
  port: ${SERVER_PORT:8085}

spring:
  application:
    name: ai-service
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  rabbitmq:
    listener:
      simple:
        acknowledge-mode: manual

ai:
  document:
    max-size-bytes: ${AI_DOCUMENT_MAX_SIZE_BYTES:10485760}
  rabbitmq:
    retry-delay-ms: ${AI_RETRY_DELAY_MS:10000}
    max-retries: ${AI_MAX_RETRIES:3}
    concurrency: ${AI_CONSUMER_CONCURRENCY:1}

management:
  endpoints:
    web:
      exposure:
        include: health,info
