spring:
  datasource:
    url: jdbc:h2:mem:question;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password: ''
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  rabbitmq:
    listener:
      simple:
        auto-startup: false
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:9999/jwks
question:
  rabbitmq:
    retry-delay-ms: 10
    max-retries: 3
eureka:
  client:
    enabled: false
