server:
  port: ${SERVER_PORT:8083}

spring:
  application:
    name: question-service
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  rabbitmq:
    listener:
      simple:
        acknowledge-mode: manual

question:
  rabbitmq:
    retry-delay-ms: ${QUESTION_RETRY_DELAY_MS:10000}
    max-retries: ${QUESTION_MAX_RETRIES:3}

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}
  image-max-size-bytes: ${CLOUDINARY_IMAGE_MAX_SIZE_BYTES:5242880}

management:
  endpoints:
    web:
      exposure:
        include: health,info
