server:
  port: ${SERVER_PORT:8083}

spring:
  application:
    name: question-service
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  rabbitmq:
    listener:
      simple:
        acknowledge-mode: manual

question:
  rabbitmq:
    retry-delay-ms: ${QUESTION_RETRY_DELAY_MS:10000}
    max-retries: ${QUESTION_MAX_RETRIES:3}

management:
  endpoints:
    web:
      exposure:
        include: health,info
